name: Deploy to Ubuntu VM

on:
  push:
    branches: [ main ]   # change if your default branch is different
  workflow_dispatch:      # allow manual runs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu VM via SCP (overwrite same-named files)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Using "." copies everything; the action overwrites files with the same name
          source: ".js"
          target: "/opt/deployment/mercom-cube/model/default"
          # Optional quality-of-life flags:
          # rm: false                  # set true to wipe target before upload (more destructive)
          # strip_components: 0        # keep folder structure

      # (Optional) Run something on the server after upload, e.g. restart a service
      # - name: Restart service
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     port: 22
      #     script: |
      #       sudo systemctl restart your-service
